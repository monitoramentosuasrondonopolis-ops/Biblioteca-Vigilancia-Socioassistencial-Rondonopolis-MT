const escRede=s=>String(s??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#39;");

const normalRede=s=>String(s??"")
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.toLowerCase();

function filtrarRedeComplemento(){

const raiz=document.getElementById("redeComplemento");
if(!raiz)return;

const busca=normalRede(
raiz.querySelector("#rcBusca").value
);
const tipo=raiz.querySelector("#rcTipo").value;

const encontrados=todosRede.filter(r=>{
return (!tipo||r[1]===tipo)&&
(!busca||normalRede(r.join(" ")).includes(busca));
});

raiz.querySelector("#rcTotal").textContent=
encontrados.length+" registros encontrados.";

raiz.querySelector("#rcResultados").innerHTML=
encontrados.map(r=>`

${escRede(r[5]||"Não informado")}</p>

<span class="rc-label">Serviços / Abrangência:</span>
${escRede(r[6]||"Não informado")}
</p>

</details>
`).join("")||"<p>Nenhum registro encontrado.</p>";
}

function montarRedeComplemento(){

const alvo=document.getElementById("conteudo");
if(!alvo)return;

document.getElementById("redeComplemento")?.remove();

alvo.insertAdjacentHTML(
"beforeend",htmlRedeComplemento()
);

const raiz=document.getElementById("redeComplemento");

const tipos=[...new Set(todosRede.map(r=>r[1]))].sort();

raiz.querySelector("#rcTipo").innerHTML=
'<option value="">Todas as categorias</option>'+
tipos.map(t=>`
<option value="${escRede(t)}">${escRede(t)}</option>
`).join("");

raiz.querySelector("#rcBusca")
.addEventListener("input",filtrarRedeComplemento);

raiz.querySelector("#rcTipo")
.addEventListener("change",filtrarRedeComplemento);

filtrarRedeComplemento();
}

/* INTEGRAÇÃO COM A ABA 2 DO PAINEL */

if(typeof window.rede==="function"){

const redeAnterior=window.rede;

window.rede=function(...args){
const resultado=redeAnterior.apply(this,args);
montarRedeComplemento();
return resultado;
};

}else{

document.addEventListener("click",e=>{
const botao=e.target.closest("button");
if(!botao)return;

const texto=normalRede(botao.textContent);

if(texto.includes("rede suas")||
texto.includes("cadsuas")){
setTimeout(montarRedeComplemento,0);
}
});
}

/* MONTA SE A ABA JÁ ESTIVER ABERTA */

const botaoAtivo=document.querySelector("#menu button.ativo");

if(botaoAtivo&&
/rede suas|cadsuas/i.test(botaoAtivo.textContent)){
montarRedeComplemento();
}

})();
</script>
