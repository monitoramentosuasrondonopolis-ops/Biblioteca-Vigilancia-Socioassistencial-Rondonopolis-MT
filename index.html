const fmtRH=n=>Number(n).toLocaleString("pt-BR");
const percRH=(a,b)=>b?
(100*a/b).toFixed(1).replace(".",",")+"%":"—";

const escapeRH=v=>String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;");

function tabelaRH(id,cabecalhos,linhas){
const alvo=document.getElementById(id);
if(!alvo)return;
alvo.replaceChildren();
const table=document.createElement("table");
const thead=table.createTHead();
const tr=thead.insertRow();
cabecalhos.forEach(h=>{
const th=document.createElement("th");
th.textContent=h;
tr.appendChild(th);
});
const body=table.createTBody();
linhas.forEach(reg=>{
const row=body.insertRow();
reg.forEach(c=>{
const td=row.insertCell();
td.textContent=String(c??"—");
});
});
alvo.appendChild(table);
}

function tabelaSimplesRH(id,cab,arr){
tabelaRH(id,cab,arr.map(r=>r.map((v,i)=>
typeof v==="number"&&Number.isInteger(v)?fmtRH(v):v
)));
}

function graficoRH(id,labels,dados,horizontal=true){
if(typeof Chart==="undefined")return;
const canvas=document.getElementById(id);
if(!canvas)return;
const anterior=Chart.getChart(canvas);
if(anterior)anterior.destroy();
new Chart(canvas,{
type:"bar",
data:{
labels,
datasets:dados
},
options:{
responsive:true,
maintainAspectRatio:false,
indexAxis:horizontal?"y":"x",
plugins:{legend:{position:"top"}},
scales:{x:{beginAtZero:true}}
}
});
}

function graficoPizzaRH(id,labels,valores){
if(typeof Chart==="undefined")return;
const canvas=document.getElementById(id);
if(!canvas)return;
const anterior=Chart.getChart(canvas);
if(anterior)anterior.destroy();
new Chart(canvas,{
type:"doughnut",
data:{
labels,
datasets:[{
data:valores,
backgroundColor:[
"#2563eb","#0d9488","#f59e0b",
"#a855f7","#64748b"
]
}]
},
options:{
responsive:true,
maintainAspectRatio:false,
plugins:{legend:{position:"bottom"}}
}
});
}

});

function filtrarLotacoesRH(){

const busca=document.getElementById("rhBuscaLotacao").value
.toLocaleLowerCase("pt-BR");

const tipo=document.getElementById("rhTipoLotacao").value;
const ordem=document.getElementById("rhOrdenacao").value;
const col=ordem==="efetivos"?3:ordem==="terceirizados"?6:2;

const lista=LOTACOES
.filter(r=>r[0].toLocaleLowerCase("pt-BR").includes(busca))
.filter(r=>!tipo||r[1]===tipo)
.sort((a,b)=>b[col]-a[col]||a[0].localeCompare(b[0],"pt-BR"));

const total=lista.reduce((a,r)=>a+r[2],0);

document.getElementById("rhTotalLotacao").textContent=
lista.length+" lotações exibidas — "+fmtRH(total)+
" registros ativos somados no recorte.";

tabelaRH("rhTabelaLotacao",
["Unidade","Tipo","Ativos","Efetivos",
"Contratados","Comissionados","Terceirizados","Horas semanais"],
lista.map(r=>r.map((v,i)=>i>=2?fmtRH(v):v))
);

}

function filtrarDimensRH(){

const busca=document.getElementById("rhBuscaDimens").value
.toLocaleLowerCase("pt-BR");
const tipo=document.getElementById("rhTipoDimens").value;

const lista=DIMENS.filter(r=>
r[0].toLocaleLowerCase("pt-BR").includes(busca)&&
(!tipo||r[1]===tipo)
);

tabelaRH("rhTabelaDimens",
["Unidade","Serviço","Famílias ref. 2026",
"Equipe mínima (quadro)","Superior exigido",
"Assistentes Sociais","Psicólogos","Pedagogos/outros",
"Coordenação"],
lista.map(r=>r.map((v,i)=>
i===2?(v===null?"—":fmtRH(v)):v
))
);

}
