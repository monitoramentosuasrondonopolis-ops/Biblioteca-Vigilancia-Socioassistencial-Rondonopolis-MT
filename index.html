/* ==========================================
   FUNÇÕES DE APRESENTAÇÃO
========================================== */

const fmtRH=n=>Number(n).toLocaleString("pt-BR");
const percRH=(a,b)=>b?(100*a/b).toFixed(1).replace(".",",")+"%":"—";
const escapeRH=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function tabelaRH(id,cabecalhos,linhas){
const alvo=document.getElementById(id);
if(!alvo)return;
alvo.replaceChildren();
const table=document.createElement("table");
const thead=table.createTHead();
const tr=thead.insertRow();
cabecalhos.forEach(h=>{
const th=document.createElement("th");
th.textContent=h;
tr.appendChild(th);
});
const body=table.createTBody();
linhas.forEach(reg=>{
const row=body.insertRow();
reg.forEach(c=>{
const td=row.insertCell();
td.textContent=String(c??"—");
});
});
alvo.appendChild(table);
}

function tabelaSimplesRH(id,cab,arr){
tabelaRH(id,cab,arr.map(r=>r.map((v,i)=>typeof v==="number"&&Number.isInteger(v)?fmtRH(v):v)));
}

function graficoRH(id,labels,dados,horizontal=true){
if(typeof Chart==="undefined")return;
const canvas=document.getElementById(id);
if(!canvas)return;
const anterior=Chart.getChart(canvas);
if(anterior)anterior.destroy();
new Chart(canvas,{
type:"bar",
data:{labels,datasets:dados},
options:{
responsive:true,
maintainAspectRatio:false,
indexAxis:horizontal?"y":"x",
plugins:{legend:{position:"top"}},
scales:{x:{beginAtZero:true}}
}
});
}

function graficoPizzaRH(id,labels,valores){
if(typeof Chart==="undefined")return;
const canvas=document.getElementById(id);
if(!canvas)return;
const anterior=Chart.getChart(canvas);
if(anterior)anterior.destroy();
new Chart(canvas,{
type:"doughnut",
data:{labels,datasets:[{data:valores,backgroundColor:["#2563eb","#0d9488","#f59e0b","#a855f7","#64748b"]}]},
options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom"}}}
});
}

/* ==========================================
   PREENCHIMENTO E FILTROS
========================================== */

function carregarGraficosRH(){
graficoRH("rhGraficoTipo", RH.tipos.map(x=>x[0]), [
 {label:"Ativos",data:RH.tipos.map(x=>x[1]),backgroundColor:"#2563eb"},
 {label:"Cadastrados",data:RH.tipos.map(x=>x[2]),backgroundColor:"#94a3b8"}
]);

graficoRH("rhGraficoProf", RH.categorias.map(x=>x[0]), [
 {label:"Ativos",data:RH.categorias.map(x=>x[1]),backgroundColor:"#0d9488"},
 {label:"Cadastrados",data:RH.categorias.map(x=>x[2]),backgroundColor:"#94a3b8"}
]);

graficoRH("rhGraficoVinculo", RH.vinculos.map(x=>x[0]), [
 {label:"Ativos",data:RH.vinculos.map(x=>x[1]),backgroundColor:"#2563eb"},
 {label:"Cadastrados",data:RH.vinculos.map(x=>x[2]),backgroundColor:"#f59e0b"}
]);

graficoPizzaRH("rhGraficoGenero", RH.genero.map(x=>x[0]), RH.genero.map(x=>x[1]));
graficoPizzaRH("rhGraficoIngresso", RH.ingresso.map(x=>x[0]), RH.ingresso.map(x=>x[1]));
}

function preencherTabelasRH(){
tabelaSimplesRH("rhTabelaTipo", ["Tipo de unidade","Ativos","Total cadastrado"], RH.tipos);
tabelaSimplesRH("rhTabelaProf", ["Categoria profissional","Ativos","Total cadastrado"], RH.categorias);
tabelaSimplesRH("rhTabelaVinculo", ["Vínculo","Ativos","Total cadastrado"], RH.vinculos);
tabelaRH("rhFaixaEtaria", ["Faixa etária","Quantidade","Participação"], RH.faixaEtaria.map(x=>[x[0],x[1],percRH(x[1],47)]));
tabelaSimplesRH("rhTabelaEfetivos", ["Unidade","Superior","Médio de referência","Apoio","Total"], EFETIVOS);
tabelaSimplesRH("rhTabelaCatVinculo", ["Categoria / Vínculo","Quantidade informada"], RH.categoriaVinculo);

filtrarOSCS();
}

function filtrarOSCS(){
const busca = document.getElementById("rhBuscaOSC").value.toLocaleLowerCase("pt-BR");
const lista = OSCS.filter(r => 
 r[0].toLocaleLowerCase("pt-BR").includes(busca) || 
 r[3].toLocaleLowerCase("pt-BR").includes(busca) ||
 r[5].toLocaleLowerCase("pt-BR").includes(busca)
);

document.getElementById("rhTotalOSC").textContent = lista.length + " instituições listadas.";

tabelaRH("rhTabelaOSC", 
 ["Instituição / Unidade", "Telefone", "Email / Site", "Responsável", "Endereço", "Atendimento / Serviços"],
 lista
);
}

function prepararFiltrosRH(){
const tipos=[...new Set(LOTACOES.map(x=>x[1]))].sort();
document.getElementById("rhTipoLotacao").innerHTML='<option value="">Todos os tipos de unidade</option>'+tipos.map(x=>`<option value="${escapeRH(x)}">${escapeRH(x)}</option>`).join("");

const grupos=[...new Set(DIMENS.map(x=>x[1]))].sort();
document.getElementById("rhTipoDimens").innerHTML='<option value="">Todos os serviços</option>'+grupos.map(x=>`<option value="${escapeRH(x)}">${escapeRH(x)}</option>`).join("");

["rhBuscaLotacao","rhTipoLotacao","rhOrdenacao"].forEach(id=>{
document.getElementById(id).addEventListener("input",filtrarLotacoesRH);
});

["rhBuscaDimens","rhTipoDimens"].forEach(id=>{
document.getElementById(id).addEventListener("input",filtrarDimensRH);
});

document.getElementById("rhBuscaOSC").addEventListener("input",filtrarOSCS);

filtrarLotacoesRH();
filtrarDimensRH();
}

function filtrarLotacoesRH(){
const busca=document.getElementById("rhBuscaLotacao").value.toLocaleLowerCase("pt-BR");
const tipo=document.getElementById("rhTipoLotacao").value;
const ordem=document.getElementById("rhOrdenacao").value;
const col=ordem==="efetivos"?3:ordem==="terceirizados"?6:2;

const lista=LOTACOES
.filter(r=>r[0].toLocaleLowerCase("pt-BR").includes(busca))
.filter(r=>!tipo||r[1]===tipo)
.sort((a,b)=>b[col]-a[col]||a[0].localeCompare(b[0],"pt-BR"));

const total=lista.reduce((a,r)=>a+r[2],0);
document.getElementById("rhTotalLotacao").textContent=lista.length+" lotações exibidas — "+fmtRH(total)+" registros ativos somados.";

tabelaRH("rhTabelaLotacao", ["Unidade","Tipo","Ativos","Efetivos","Contratados","Comissionados","Terceirizados","Horas semanais"], lista.map(r=>r.map((v,i)=>i>=2?fmtRH(v):v)));
}

function filtrarDimensRH(){
const busca=document.getElementById("rhBuscaDimens").value.toLocaleLowerCase("pt-BR");
const tipo=document.getElementById("rhTipoDimens").value;

const lista=DIMENS.filter(r=>r[0].toLocaleLowerCase("pt-BR").includes(busca)&&(!tipo||r[1]===tipo));
tabelaRH("rhTabelaDimens", ["Unidade","Serviço","Famílias ref. 2026","Equipe mínima (quadro)","Superior exigido","Assistentes Sociais","Psicólogos","Pedagogos/outros","Coordenação"], lista.map(r=>r.map((v,i)=>i===2?(v===null?"—":fmtRH(v)):v)));
}

function analisesRH(){
const unidadesSemEfetivos=EFETIVOS.filter(r=>r[4]===0).map(r=>r[0]);
const maiores=LOTACOES.slice().sort((a,b)=>b[2]-a[2]).slice(0,5);

document.getElementById("rhAnalises").innerHTML=`
<div class="rh-alert">
<b>1. Conferência do quadro de pessoal:</b> o consolidado informa 284 ativos e 289 cadastrados. Recomenda-se conciliação com a base nominal interna.
</div>
<div class="rh-alert">
<b>2. Unidades sem efetivos no recorte específico:</b> ${escapeRH(unidadesSemEfetivos.join("; "))}.
</div>
<div class="rh-alert">
<b>3. Maiores lotações por número de ativos:</b> ${maiores.map(x=>escapeRH(x[0])+" ("+x[2]+")").join("; ")}.
</div>
<div class="rh-ok">
<b>4. Recomendação de monitoramento:</b> manter atualização periódica integrada entre Gestão do Trabalho, CadSUAS, Censo SUAS e OSCs parceiras.
</div>
`;
}

/* ==========================================
   INTEGRAÇÃO À ABA 2
========================================== */

function montarGestaoRH(){
const alvo=document.getElementById("conteudo");
if(!alvo)return;
if(document.getElementById("cad-rh"))return;

alvo.insertAdjacentHTML("beforeend",htmlGestaoRH());

preencherTabelasRH();
prepararFiltrosRH();
analisesRH();
carregarGraficosRH();
}

if(typeof window.rede==="function"){
const redeOriginal=window.rede;
window.rede=function(){
redeOriginal();
montarGestaoRH();
};
}else{
console.warn("Módulo Gestão do Trabalho: função rede() não encontrada.");
}

})();
</script>
<!-- FIM DO MÓDULO GESTÃO DO TRABALHO E REDE COMPLETA -->
