@media(max-width:600px){
  #ibge-interativo .ibge-chart{height:300px}
}
</style>

<script>
(function(){
"use strict";

const IBGE_CODIGO="5107602";
const IBGE_UF="51";

const IBGE_API={
 localidade:
 "https://servicodados.ibge.gov.br/api/v1/localidades/municipios/5107602",

 censoMunicipio:
 "https://servicodados.ibge.gov.br/api/v3/agregados/4714/periodos/2022/variaveis/93%7C6318%7C614?localidades=N6%5B5107602%5D",

 censoEstado:
 "https://servicodados.ibge.gov.br/api/v3/agregados/4714/periodos/2022/variaveis/93?localidades=N3%5B51%5D",

 estimativas:
 "https://servicodados.ibge.gov.br/api/v3/agregados/6579/periodos/-6/variaveis/9324?localidades=N6%5B5107602%5D"
};

let dadosIBGE={
 municipio:null,
 censo:{},
 estado:{},
 estimativas:[]
};

const graficosIBGE={};

const formatarIBGE=(n,casas=0)=>
 Number(n).toLocaleString("pt-BR",{
  minimumFractionDigits:casas,
  maximumFractionDigits:casas
 });

function numeroIBGE(valor){
 if(valor===null||valor===undefined)return null;
 const s=String(valor).trim();
 if(!s||s==="-"||s==="..."||s==="X"||s==="..")
  return null;
 const n=Number(s);
 return Number.isFinite(n)?n:null;
}

function textoSeguroIBGE(valor){
 return String(valor??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;");
}

async function requisicaoIBGE(url){
 const resposta=await fetch(url,{
  headers:{"Accept":"application/json"},
  cache:"no-store"
 });
 if(!resposta.ok){
  throw new Error("API retornou HTTP "+resposta.status);
 }
 return await resposta.json();
}

function obterVariaveisIBGE(resposta){
 const resultado={};

 if(!Array.isArray(resposta))return resultado;

 resposta.forEach(item=>{
  const id=String(item.id);
  const serie=item.resultados?.[0]?.series?.[0]?.serie;

  if(!serie)return;

  const periodo=Object.keys(serie)[0];
  resultado[id]={
   nome:item.variavel||id,
   unidade:item.unidade||"",
   periodo,
   valor:numeroIBGE(serie[periodo])
  };
 });

 return resultado;
}

function obterEstimativasIBGE(resposta){
 if(!Array.isArray(resposta))return [];

 const serie=resposta[0]?.resultados?.[0]?.series?.[0]?.serie;

 if(!serie)return [];

 return Object.entries(serie)
 .map(([ano,valor])=>({
  ano:Number(ano),
  populacao:numeroIBGE(valor)
 }))
 .filter(x=>Number.isInteger(x.ano)&&x.populacao!==null)
 .sort((a,b)=>a.ano-b.ano);
}

function criarPainelIBGE(){
 return `
 <section id="ibge-interativo">

  <div class="ibge-card">
   <h2>Panorama Estatístico Interativo — IBGE</h2>
   <p>
    Município de Rondonópolis, Mato Grosso.
    Indicadores consultados diretamente nas APIs
    oficiais de Localidades e de Agregados do IBGE.
   </p>

   <div class="ibge-tools">
    <button id="ibge-atualizar" type="button">
     Atualizar dados do IBGE
    </button>
    <span id="ibge-situacao" aria-live="polite">
     Aguardando consulta...
    </span>
   </div>

   <div id="ibge-indicadores" class="ibge-grid"></div>
  </div>

  <div class="ibge-card">
   <h3>Evolução das estimativas populacionais</h3>
   <p>
    Série anual de estimativas disponíveis
    na tabela 6579 do IBGE.
   </p>

   <div class="ibge-chart">
    <canvas id="ibge-grafico-evolucao"></canvas>
   </div>

   <div id="ibge-analise-evolucao"
        class="ibge-info">
    Aguardando dados.
   </div>
  </div>

  <div class="ibge-card">
   <h3>Comparativo: Rondonópolis e Mato Grosso</h3>
   <p>
    População residente apurada pelo Censo 2022.
   </p>

   <div class="ibge-chart">
    <canvas id="ibge-grafico-comparativo"></canvas>
   </div>

   <div id="ibge-analise-comparativo"
        class="ibge-info">
    Aguardando dados.
   </div>
  </div>

  <div class="ibge-card">
   <h3>Consulta interativa dos indicadores</h3>

   <div class="ibge-tools">
    <select id="ibge-selecionar">
     <option value="93">População residente</option>
     <option value="6318">Área territorial do Censo</option>
     <option value="614">Densidade demográfica</option>
    </select>
   </div>

   <div id="ibge-detalhe"></div>
  </div>

  <div class="ibge-card">
   <h3>Identificação territorial do município</h3>
   <div id="ibge-localidade"></div>
  </div>

  <div class="ibge-card">
   <h3>Fontes e metodologia</h3>

   <div class="ibge-links">
    <a href="https://cidades.ibge.gov.br/brasil/mt/rondonopolis/panorama"
       target="_blank" rel="noopener">
       IBGE Cidades
    </a>

    <a href="https://servicodados.ibge.gov.br/api/docs/agregados?versao=3"
       target="_blank" rel="noopener">
       Documentação da API de Agregados
    </a>

    <a href="https://servicodados.ibge.gov.br/api/docs/localidades"
       target="_blank" rel="noopener">
       Documentação da API de Localidades
    </a>
   </div>

   <div class="ibge-alerta">
    Os indicadores do Censo 2022 representam
    informações censitárias, enquanto a tabela
    de estimativas apresenta resultados anuais
    de outra operação estatística.

    Os dados não são necessariamente atualizados
    todos os anos nem devem ser interpretados
    como se pertencessem à mesma pesquisa.
   </div>

   <p class="ibge-muted">
    Fonte: IBGE — APIs de Agregados e Localidades.
    Código do município: 5107602.
    Os dados exibidos são resultados agregados,
    sem informações pessoais.
   </p>
  </div>

 </section>`;
}

function montarKPIsIBGE(){

 const c=dadosIBGE.censo;
 const ult=dadosIBGE.estimativas.at(-1);

 const itens=[
  ["População residente — Censo 2022",
   c["93"]?.valor,
   "habitantes"],
  ["Área territorial — tabela 4714",
   c["6318"]?.valor,
   "km²"],
  ["Densidade demográfica — Censo 2022",
   c["614"]?.valor,
   "hab./km²"],
  ["Última estimativa disponível",
   ult?.populacao,
   ult?"habitantes — "+ult.ano:""]
 ];

 document.getElementById("ibge-indicadores").innerHTML=
 itens.map((r,i)=>`
  <div class="ibge-kpi">
   <small>${textoSeguroIBGE(r[0])}</small>
   <strong>
    ${r[1]===null||r[1]===undefined
      ?"Indisponível"
      :formatarIBGE(r[1],i===1||i===2?2:0)}
   </strong>
   <small>${textoSeguroIBGE(r[2])}</small>
  </div>
 `).join("");
}

function desenharGraficoIBGE(id,tipo,labels,datasets,opcoes={}){

 if(typeof Chart==="undefined")return;

 const canvas=document.getElementById(id);
 if(!canvas)return;

 if(graficosIBGE[id]){
  graficosIBGE[id].destroy();
 }

 graficosIBGE[id]=new Chart(canvas,{
  type:tipo,
  data:{labels,datasets},
  options:{
   responsive:true,
   maintainAspectRatio:false,
   plugins:{
    legend:{position:"top"}
   },
   ...opcoes
  }
 });
}

function montarEvolucaoIBGE(){

 const dados=dadosIBGE.estimativas;

 if(!dados.length){
  document.getElementById("ibge-analise-evolucao")
   .textContent="Série de estimativas indisponível.";
  return;
 }

 desenharGraficoIBGE(
  "ibge-grafico-evolucao",
  "line",
  dados.map(d=>String(d.ano)),
  [{
   label:"População estimada",
   data:dados.map(d=>d.populacao),
   borderColor:"#2563eb",
   backgroundColor:"rgba(37,99,235,.12)",
   tension:.25,
   fill:true
  }]
 );

 const primeiro=dados[0];
 const ultimo=dados[dados.length-1];

 const diferenca=ultimo.populacao-primeiro.populacao;
 const variacao=primeiro.populacao?
   100*diferenca/primeiro.populacao:null;

 document.getElementById("ibge-analise-evolucao").textContent=
  "Entre "+primeiro.ano+" e "+ultimo.ano+
  ", as estimativas passaram de "+
  formatarIBGE(primeiro.populacao)+" para "+
  formatarIBGE(ultimo.populacao)+" habitantes. "+
  (variacao===null?"":"Variação aproximada de "+
  formatarIBGE(variacao,2)+"%.")+
  " Isso representa variação estimada da população, "+
  "não uma contagem censitária.";
}

function montarComparativoIBGE(){

 const municipal=dadosIBGE.censo["93"]?.valor;
 const estadual=dadosIBGE.estado["93"]?.valor;

 if(municipal===null||municipal===undefined||
 estadual===null||estadual===undefined){
  document.getElementById("ibge-analise-comparativo")
   .textContent="Comparativo indisponível na consulta.";
  return;
 }

 const restante=Math.max(0,estadual-municipal);

 desenharGraficoIBGE(
  "ibge-grafico-comparativo",
  "doughnut",
  ["Rondonópolis","Demais municípios de Mato Grosso"],
  [{
   data:[municipal,restante],
   backgroundColor:["#2563eb","#cbd5e1"]
  }]
 );

 const participacao=100*municipal/estadual;

 document.getElementById("ibge-analise-comparativo")
  .textContent=
  "Rondonópolis concentrava aproximadamente "+
  formatarIBGE(participacao,2)+
  "% da população residente de Mato Grosso "+
  "no Censo Demográfico de 2022.";
}

function montarDetalheIBGE(){

 const id=document.getElementById("ibge-selecionar").value;
 const dado=dadosIBGE.censo[id];
 const alvo=document.getElementById("ibge-detalhe");

 if(!dado||dado.valor===null){
  alvo.textContent="Indicador não disponível na consulta.";
  return;
 }

 alvo.innerHTML=`
  <div class="ibge-grid">
   <div class="ibge-kpi">
    <small>${textoSeguroIBGE(dado.nome)}</small>
    <strong>${formatarIBGE(
      dado.valor,id==="93"?0:2
    )}</strong>
    <small>${textoSeguroIBGE(dado.unidade)}</small>
   </div>
   <div class="ibge-kpi">
    <small>Período de referência</small>
    <strong>${textoSeguroIBGE(dado.periodo)}</strong>
    <small>Fonte: IBGE, tabela 4714</small>
   </div>
  </div>`;
}

function montarTerritorioIBGE(){

 const municipio=dadosIBGE.municipio;
 const alvo=document.getElementById("ibge-localidade");

 if(!municipio){
  alvo.textContent="Informação territorial indisponível.";
  return;
 }

 // A API pode apresentar hierarquias alternativas
 // conforme sua versão.
 const uf=municipio.microrregiao?.mesorregiao?.UF||
 municipio["regiao-imediata"]?.["regiao-intermediaria"]?.UF;

 const imediata=municipio["regiao-imediata"];
 const intermediaria=imediata?.["regiao-intermediaria"];

 const dados=[
  ["Município",municipio.nome],
  ["Código IBGE",municipio.id],
  ["UF",uf?.nome||"Mato Grosso"],
  ["Região geográfica imediata",imediata?.nome||"Não informado"],
  ["Região geográfica intermediária",intermediaria?.nome||"Não informado"]
 ];

 alvo.innerHTML=`
  <div style="overflow-x:auto">
   <table>
    <thead><tr>
     <th>Identificação</th>
     <th>Informação</th>
    </tr></thead>
    <tbody>
    ${dados.map(r=>`
      <tr>
       <td>${textoSeguroIBGE(r[0])}</td>
       <td>${textoSeguroIBGE(r[1])}</td>
      </tr>
    `).join("")}
    </tbody>
   </table>
  </div>`;
}

async function atualizarDadosIBGE(){

 const raiz=document.getElementById("ibge-interativo");
 if(!raiz)return;

 const botao=document.getElementById("ibge-atualizar");
 const situacao=document.getElementById("ibge-situacao");

 botao.disabled=true;
 situacao.textContent="Consultando API oficial do IBGE...";

 const consultas=await Promise.allSettled([
  requisicaoIBGE(IBGE_API.localidade),
  requisicaoIBGE(IBGE_API.censoMunicipio),
  requisicaoIBGE(IBGE_API.censoEstado),
  requisicaoIBGE(IBGE_API.estimativas)
 ]);

 dadosIBGE.municipio=
  consultas[0].status==="fulfilled"?consultas[0].value:null;

 dadosIBGE.censo=
  consultas[1].status==="fulfilled"?
  obterVariaveisIBGE(consultas[1].value):{};

 dadosIBGE.estado=
  consultas[2].status==="fulfilled"?
  obterVariaveisIBGE(consultas[2].value):{};

 dadosIBGE.estimativas=
  consultas[3].status==="fulfilled"?
  obterEstimativasIBGE(consultas[3].value):[];

 if(!document.getElementById("ibge-interativo"))return;

 montarKPIsIBGE();
 montarEvolucaoIBGE();
 montarComparativoIBGE();
 montarDetalheIBGE();
 montarTerritorioIBGE();

 const sucesso=consultas.filter(
  x=>x.status==="fulfilled"
 ).length;

 situacao.textContent=
 sucesso===4?
 "Consulta concluída — 4 fontes carregadas.":
 "Consulta parcial: "+sucesso+
 " de 4 fontes carregadas. Tente atualizar novamente.";

 botao.disabled=false;
}

function instalarPainelIBGE(){

 const alvo=document.getElementById("conteudo");
 if(!alvo)return;

 Object.values(graficosIBGE).forEach(g=>g.destroy());
 Object.keys(graficosIBGE).forEach(k=>delete graficosIBGE[k]);

 document.getElementById("ibge-interativo")?.remove();

 alvo.insertAdjacentHTML("beforeend",criarPainelIBGE());

 document.getElementById("ibge-atualizar")
 .addEventListener("click",atualizarDadosIBGE);

 document.getElementById("ibge-selecionar")
 .addEventListener("change",montarDetalheIBGE);

 atualizarDadosIBGE();
}

/* INTEGRAÇÃO COM A ABA 1 — MUNICÍPIO E IBGE */

if(typeof window.municipio==="function"){

 const municipioOriginal=window.municipio;

 window.municipio=function(...args){
  const resultado=municipioOriginal.apply(this,args);
  instalarPainelIBGE();
  return resultado;
 };

}else{

 // Alternativa caso a versão tenha outra
 // forma de navegação entre abas.
 document.addEventListener("click",e=>{

  const botao=e.target.closest("button");
  if(!botao)return;

  if(/munic[ií]pio.*ibge/i.test(botao.textContent)){
   setTimeout(instalarPainelIBGE,0);
  }
 });
}

const ativo=document.querySelector("#menu button.ativo");

if(ativo&&/munic[ií]pio.*ibge/i.test(ativo.textContent)){
 instalarPainelIBGE();
}

})();
</script>
