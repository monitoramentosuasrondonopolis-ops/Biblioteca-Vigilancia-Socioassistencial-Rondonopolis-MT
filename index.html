<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
#pmas2026 {
  font-family: Arial, sans-serif;

  width: 100%;

  background: #dbeafe;

  padding: 5px 9px;
  display: inline-block;
}
</style>

<script>
(function(){

"use strict";

/* =========================================
   BANCO DE DADOS
========================================= */

let metasPMAS = [];
let metasSETASC = [];
let graficosPMAS = [];

const resumoAreas = [
  ["Gestão do SUAS",59],
  ["Proteção Social Especial",37],
  ["Proteção Social Básica",32],
  ["Engenharia e Arquitetura",20],
  ["Benefícios Socioassistenciais",20],
  ["Gestão Financeira",15],
  ["Controle Social",8]
];

const numeroPMAS = valor =>
  Number(valor).toLocaleString("pt-BR");

function seguroPMAS(valor){
  return String(valor ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function valorPMAS(v){
  if(v === null || v === undefined) return "";
  return String(v);
}

/* =========================================
   IMPORTAÇÃO DA PLANILHA OFICIAL
========================================= */

function importarPMAS(arquivo){

  if(!arquivo){
    return;
  }

  if(typeof XLSX === "undefined"){
    alert("Biblioteca de planilhas indisponível.");
    return;
  }

  const leitor = new FileReader();

  leitor.onload = function(evento){

    try{

      const workbook = XLSX.read(
        evento.target.result,
        {type:"array",cellDates:true}
      );

      const nomePMAS = workbook.SheetNames.find(
        nome => nome.trim() === "PMAS Consolidado"
      ) || workbook.SheetNames.find(
        nome => nome.trim() === "Base Original"
      );

      const nomeSETASC = workbook.SheetNames.find(
        nome => nome.trim() === "SETASC Consolidado"
      );

      if(!nomePMAS || !nomeSETASC){
        alert(
          "Não foram encontradas as abas PMAS Consolidado e SETASC Consolidado."
        );
        return;
      }

      const matrizPMAS = XLSX.utils.sheet_to_json(
        workbook.Sheets[nomePMAS],
        {header:1,defval:"",raw:false}
      );

      const matrizSETASC = XLSX.utils.sheet_to_json(
        workbook.Sheets[nomeSETASC],
        {header:1,defval:"",raw:false}
      );

      metasPMAS = matrizPMAS.slice(4)
        .filter(r => /^\d+$/.test(String(r[0]).trim()))
        .map(r => ({
          numero:r[0],
          eixo:r[1],
          diretriz:r[2],
          objetivo:r[3],
          acao:r[4],
          ano2026:r[5],
          ano2027:r[6],
          ano2028:r[7],
          ano2029:r[8],
          periodo:r[9],
          situacao:r[10],
          semaforo:r[11],
          resultado:r[12],
          impacto:r[13],
          responsavel:r[14],
          indicador:r[15],
          linha:r
        }));

      metasSETASC = matrizSETASC.slice(4)
        .filter(r => /^\d+$/.test(String(r[0]).trim()))
        .map(r => ({
          id:r[0],
          semaforo:r[1],
          status:r[2],
          eixo:r[3],
          unidade:r[4],
          dificuldade:r[5],
          acao:r[6],
          responsavel:r[7],
          prazo:r[8],
          execucao:r[9],
          proximo:r[10],
          atualizacao:r[11],
          linha:r
        }));

      preencherFiltrosPMAS();
      atualizarPMAS();

    }catch(erro){
      console.error(erro);
      alert("Erro ao interpretar a planilha: "+erro.message);
    }
  };

  leitor.readAsArrayBuffer(arquivo);
}

/* =========================================
   INTERFACE PRINCIPAL
========================================= */

function telaPMAS(){

  return `
  <div id="pmas2026">

    <div class="pmas-box">

      <h2>Resumo Visual do PMAS 2026–2029</h2>

      <p>
        Prefeitura Municipal de Rondonópolis —
        Vigilância Socioassistencial.
      </p>

      <div class="pmas-grid">

        <div class="pmas-kpi">
          <small>Metas PMAS previstas</small>
          <strong>191</strong>
        </div>

        <div class="pmas-kpi">
          <small>Providências SETASC</small>
          <strong>64</strong>
        </div>

        <div class="pmas-kpi">
          <small>Áreas de acompanhamento</small>
          <strong>7</strong>
        </div>

        <div class="pmas-kpi">
          <small>Vigência do PMAS</small>
          <strong>2026–2029</strong>
        </div>

      </div>

      <div class="pmas-aviso">
        Importe a planilha oficial
        <b>metas_pmas_com_setasc.xlsm</b>
        para carregar as metas completas e as
        providências SETASC.

        <p>
          Os quantitativos acima representam o
          planejamento cadastrado, não a execução
          das metas.
        </p>
      </div>

      <input
        type="file"
        id="arquivoPMAS"
        accept=".xlsx,.xlsm,.xls"
      >

      <p id="situacaoImportacaoPMAS">
        Aguardando importação da planilha.
      </p>

    </div>

    <div class="pmas-box">

      <h3>Distribuição das metas por área</h3>

      <div class="pmas-grafico">
        <canvas id="graficoAreasPMAS"></canvas>
      </div>

    </div>

    <div class="pmas-box">

      <h3>Consulta e Monitoramento das Metas</h3>

      <div class="pmas-filtros">

        <input
          id="buscaMetaPMAS"
          placeholder="Pesquisar número, meta, diretriz ou ação..."
        >

        <select id="filtroEixoPMAS">
          <option value="">Todos os eixos</option>
        </select>

        <select id="filtroAnoPMAS">
          <option value="">Todos os anos</option>
          <option value="2026">2026</option>
          <option value="2027">2027</option>
          <option value="2028">2028</option>
          <option value="2029">2029</option>
        </select>

        <select id="filtroSituacaoPMAS">
          <option value="">Todas as situações</option>
        </select>

      </div>

      <div id="indicadoresFiltroPMAS"></div>

      <div id="listaMetasPMAS"></div>

    </div>

    <div class="pmas-box">

      <h3>Plano de Aprimoramento — SETASC</h3>

      <div class="pmas-grafico">
        <canvas id="graficoSETASC"></canvas>
      </div>

      <div class="pmas-filtros">

        <input
          id="buscaSETASC"
          placeholder="Pesquisar unidade, providência ou responsável..."
        >

        <select id="filtroSETASC">
          <option value="">Todas as situações</option>
        </select>

      </div>

      <div id="listaSETASC"></div>

    </div>

    <div class="pmas-box">

      <h3>Análise Técnica e Monitoramento</h3>

      <p>
        A Vigilância Socioassistencial poderá
        utilizar o painel para identificar metas
        com necessidade de acompanhamento,
        comparar o planejamento plurianual e
        consolidar informações para a gestão
        e o controle social.
      </p>

      <div class="pmas-aviso">
        Os resultados previstos e percentuais
        planejados para os anos de 2026, 2027,
        2028 e 2029 não devem ser classificados
        como execução realizada sem evidência
        documental correspondente.
      </div>

    </div>

  </div>`;
}

/* =========================================
   GRÁFICOS
========================================= */

function limparGraficosPMAS(){
  graficosPMAS.forEach(g => g.destroy());
  graficosPMAS = [];
}

function graficosResumoPMAS(){

  if(typeof Chart === "undefined") return;

  const elemento=document.getElementById(
    "graficoAreasPMAS"
  );

  if(!elemento)return;

  graficosPMAS.push(new Chart(elemento,{
    type:"bar",
    data:{
      labels:resumoAreas.map(a=>a[0]),
      datasets:[{
        label:"Quantidade de metas",
        data:resumoAreas.map(a=>a[1]),
        backgroundColor:"#2563eb"
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      indexAxis:"y",
      plugins:{
        legend:{display:false}
      },
      scales:{
        x:{beginAtZero:true}
      }
    }
  }));
}

function graficoSituacaoSETASC(){

  if(typeof Chart==="undefined")return;

  const canvas=document.getElementById(
    "graficoSETASC"
  );

  if(!canvas || !metasSETASC.length)return;

  const contagem={};

  metasSETASC.forEach(meta=>{
    const s=valorPMAS(meta.status).trim() ||
      "Não informado";
    contagem[s]=(contagem[s]||0)+1;
  });

  graficosPMAS
    .filter(g=>g.canvas===canvas)
    .forEach(g=>g.destroy());

  graficosPMAS=graficosPMAS.filter(
    g=>g.canvas!==canvas
  );

  graficosPMAS.push(new Chart(canvas,{
    type:"doughnut",
    data:{
      labels:Object.keys(contagem),
      datasets:[{
        data:Object.values(contagem),
        backgroundColor:[
          "#16a34a",
          "#2563eb",
          "#eab308",
          "#dc2626",
          "#94a3b8"
        ]
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{
        legend:{position:"bottom"}
      }
    }
  }));
}

/* =========================================
   FILTROS
========================================= */

function preencherFiltrosPMAS(){

  const eixos=[
    ...new Set(
      metasPMAS.map(m=>valorPMAS(m.eixo))
        .filter(Boolean)
    )
  ].sort();

  document.getElementById("filtroEixoPMAS")
    .innerHTML='<option value="">Todos os eixos</option>'+
    eixos.map(e=>`
      <option value="${seguroPMAS(e)}">
        ${seguroPMAS(e)}
      </option>
    `).join("");

  const situacoes=[
    ...new Set(
      metasPMAS.map(m=>valorPMAS(m.situacao))
        .filter(Boolean)
    )
  ].sort();

  document.getElementById("filtroSituacaoPMAS")
    .innerHTML=
    '<option value="">Todas as situações</option>'+
    situacoes.map(s=>`
      <option value="${seguroPMAS(s)}">
        ${seguroPMAS(s)}
      </option>
    `).join("");

  const statusSETASC=[
    ...new Set(
      metasSETASC.map(m=>valorPMAS(m.status))
        .filter(Boolean)
    )
  ].sort();

  document.getElementById("filtroSETASC")
    .innerHTML=
    '<option value="">Todas as situações</option>'+
    statusSETASC.map(s=>`
      <option value="${seguroPMAS(s)}">
        ${seguroPMAS(s)}
      </option>
    `).join("");
}

/* =========================================
   LISTA DE METAS PMAS
========================================= */

function atualizarMetasPMAS(){

  const busca=document.getElementById(
    "buscaMetaPMAS"
  ).value.toLowerCase();

  const eixo=document.getElementById(
    "filtroEixoPMAS"
  ).value;

  const ano=document.getElementById(
    "filtroAnoPMAS"
  ).value;

  const situacao=document.getElementById(
    "filtroSituacaoPMAS"
  ).value;

  let lista=metasPMAS.filter(m=>{

    const texto=Object.values(m)
      .filter(v=>typeof v!=="object")
      .join(" ").toLowerCase();

    if(busca && !texto.includes(busca))return false;
    if(eixo && valorPMAS(m.eixo)!==eixo)return false;

    if(situacao &&
       valorPMAS(m.situacao)!==situacao)return false;

    if(ano && !valorPMAS(m["ano"+ano]).trim())
      return false;

    return true;
  });

  document.getElementById("indicadoresFiltroPMAS")
    .innerHTML=`
      <div class="pmas-grid">
        <div class="pmas-kpi">
          <small>Metas encontradas</small>
          <strong>${lista.length}</strong>
        </div>
        <div class="pmas-kpi">
          <small>Total importado</small>
          <strong>${metasPMAS.length}</strong>
        </div>
      </div>
    `;

  document.getElementById("listaMetasPMAS")
    .innerHTML=lista.length?
    lista.map(m=>`

      <details>

        <summary>
          Meta ${seguroPMAS(m.numero)} —
          ${seguroPMAS(m.eixo)}
          ${m.situacao?
          " | "+seguroPMAS(m.situacao):""}
        </summary>

        <div class="pmas-meta">
          <b>Diretriz estratégica:</b>
          ${seguroPMAS(m.diretriz)}
        </div>

        <div class="pmas-meta">
          <b>Objetivo específico:</b>
          ${seguroPMAS(m.objetivo)}
        </div>

        <div class="pmas-meta">
          <b>Ação estratégica:</b>
          ${seguroPMAS(m.acao)}
        </div>

        <h4>Planejamento anual</h4>

        <div class="pmas-grid">
          ${[2026,2027,2028,2029].map(a=>`
            <div class="pmas-kpi">
              <small>${a}</small>
              <strong style="font-size:19px">
                ${seguroPMAS(m["ano"+a]) || "—"}
              </strong>
            </div>
          `).join("")}
        </div>

        <p><b>Período de execução:</b>
          ${seguroPMAS(m.periodo)||"Não informado"}</p>

        <p><b>Situação:</b>
          ${seguroPMAS(m.situacao)||"Não informada"}</p>

        <p><b>Resultados:</b>
          ${seguroPMAS(m.resultado)||"Consultar base original"}</p>

        <p><b>Impacto:</b>
          ${seguroPMAS(m.impacto)||"Consultar base original"}</p>

      </details>

    `).join(""):
    '<p>Nenhuma meta encontrada para os filtros selecionados.</p>';
}

/* =========================================
   LISTA SETASC
========================================= */

function atualizarSETASC(){

  const busca=document.getElementById(
    "buscaSETASC"
  ).value.toLowerCase();

  const filtro=document.getElementById(
    "filtroSETASC"
  ).value;

  const lista=metasSETASC.filter(m=>{

    const texto=[
      m.id,m.eixo,m.unidade,m.dificuldade,
      m.acao,m.responsavel,m.prazo,m.status
    ].join(" ").toLowerCase();

    return (!busca||texto.includes(busca)) &&
      (!filtro||valorPMAS(m.status)===filtro);
  });

  document.getElementById("listaSETASC").innerHTML=`

    <p>
      <b>${lista.length}</b> providências encontradas.
      Total importado: ${metasSETASC.length}.
    </p>

    ${lista.map(m=>`

      <details>

        <summary>
          Providência ${seguroPMAS(m.id)} —
          ${seguroPMAS(m.unidade)}
          | ${seguroPMAS(m.status)}
        </summary>

        <p><b>Eixo:</b>
          ${seguroPMAS(m.eixo)}</p>

        <p><b>Dificuldade / Meta:</b>
          ${seguroPMAS(m.dificuldade)}</p>

        <p><b>Ação:</b>
          ${seguroPMAS(m.acao)}</p>

        <p><b>Responsável:</b>
          ${seguroPMAS(m.responsavel)}</p>

        <p><b>Prazo:</b>
          ${seguroPMAS(m.prazo)}</p>

        <p><b>Execução registrada:</b>
          ${seguroPMAS(m.execucao)}</p>

        <p><b>Próximo passo:</b>
          ${seguroPMAS(m.proximo)}</p>

        <p><b>Última atualização:</b>
          ${seguroPMAS(m.atualizacao)}</p>

      </details>

    `).join("")}
  `;
}

function atualizarPMAS(){

  document.getElementById("situacaoImportacaoPMAS")
    .textContent=
    "Planilha carregada: "+metasPMAS.length+
    " metas PMAS e "+metasSETASC.length+
    " providências SETASC.";

  atualizarMetasPMAS();
  atualizarSETASC();
  graficoSituacaoSETASC();
}

/* =========================================
   INTEGRAÇÃO COM A ABA 11
========================================= */

function iniciarPainelPMAS(){

  const alvo=document.getElementById("conteudo");

  if(!alvo)return;

  limparGraficosPMAS();

  alvo.innerHTML=telaPMAS();

  document.getElementById("arquivoPMAS")
    .addEventListener("change",function(){
      importarPMAS(this.files[0]);
    });

  [
    "buscaMetaPMAS",
    "filtroEixoPMAS",
    "filtroAnoPMAS",
    "filtroSituacaoPMAS"
  ].forEach(id=>{
    document.getElementById(id)
      .addEventListener("input",atualizarMetasPMAS);
  });

  [
    "buscaSETASC",
    "filtroSETASC"
  ].forEach(id=>{
    document.getElementById(id)
      .addEventListener("input",atualizarSETASC);
  });

  preencherFiltrosPMAS();
  atualizarMetasPMAS();
  atualizarSETASC();
  graficosResumoPMAS();

  if(metasSETASC.length)graficoSituacaoSETASC();
}

/*
 Substitui a função de conteúdo da aba 11.
 Mantém a navegação das outras onze abas.
*/

window.pmas=iniciarPainelPMAS;

})();
</script>
<!-- FIM DO PAINEL PMAS -->
