<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca de Dados VSA - Rondonópolis-MT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
    <header class="bg-blue-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <span class="bg-blue-800 text-blue-200 text-xs font-semibold px-2.5 py-1 rounded uppercase tracking-wider">SEMPRAS · Rondonópolis-MT</span>
                    <h1 class="text-2xl md:text-3xl font-bold mt-1">Biblioteca de Dados da Vigilância Socioassistencial</h1>
                    <p class="text-blue-200 text-sm mt-1">Repositório de fontes, links oficiais e indicadores do município.</p>
                </div>
                <div class="bg-blue-800/60 p-3 rounded-lg border border-blue-700 text-xs text-blue-100">
                    <p class="font-semibold">🔄 Atualização do Sistema</p>
                    <p class="mt-0.5">Última atualização: <span id="ultima-atualizacao">Carregando...</span></p>
                </div>
            </div>
        </div>
    </header>

    <div class="bg-white border-b shadow-sm sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                    <i data-lucide="search" class="w-5 h-5"></i>
                </span>
                <input type="text" id="busca-global" placeholder="Pesquisar sistemas, links ou indicadores de Rondonópolis..." class="w-full pl-10 pr-4 py-3 bg-slate-100 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition">
            </div>
        </div>
    </div>

    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        <div class="flex overflow-x-auto space-x-2 border-b border-slate-200 pb-2 mb-6 scrollbar-none" id="abas-container"></div>
        <div id="painel-conteudo"></div>
    </main>

    <footer class="bg-slate-800 text-slate-400 py-6 mt-auto text-center text-sm">
        <p>Prefeitura Municipal de Rondonópolis - SEMPRAS</p>
        <p class="mt-1 text-xs">Vigilância Socioassistencial</p>
    </footer>

    <script>
        let dadosGlobais = {};
        let abaAtiva = '';

        async function carregarDados() {
            try {
                const resposta = await fetch('dados.json?' + new Date().getTime());
                dadosGlobais = await resposta.json();
                document.getElementById('ultima-atualizacao').innerText = dadosGlobais.ultimaAtualizacao || 'Desconhecida';
                inicializarAbas();
                renderizarConteudo();
            } catch (erro) {
                console.error("Erro ao carregar dados:", erro);
                document.getElementById('painel-conteudo').innerHTML = '<div class="p-4 bg-red-100 text-red-700 rounded-lg">Erro ao carregar o arquivo dados.json.</div>';
            }
        }

        function inicializarAbas() {
            const container = document.getElementById('abas-container');
            container.innerHTML = '';
            const categorias = Object.keys(dadosGlobais.categorias || {});
            
            if (categorias.length > 0 && !abaAtiva) abaAtiva = categorias[0];

            categorias.forEach(catKey => {
                const cat = dadosGlobais.categorias[catKey];
                const btn = document.createElement('button');
                btn.className = `px-4 py-2 rounded-lg font-medium text-sm whitespace-nowrap transition flex items-center gap-2 ${catKey === abaAtiva ? 'bg-blue-600 text-white shadow' : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'}`;
                btn.innerHTML = `<i data-lucide="${cat.icone || 'folder'}" class="w-4 h-4"></i> ${cat.titulo}`;
                btn.onclick = () => {
                    abaAtiva = catKey;
                    inicializarAbas();
                    renderizarConteudo();
                };
                container.appendChild(btn);
            });
            lucide.createIcons();
        }

        function renderizarConteudo(filtroBusca = '') {
            const painel = document.getElementById('painel-conteudo');
            if (!dadosGlobais.categorias || !dadosGlobais.categorias[abaAtiva]) return;

            const cat = dadosGlobais.categorias[abaAtiva];
            let html = `<div class="mb-6"><h2 class="text-xl font-bold text-slate-900">${cat.titulo}</h2><p class="text-slate-600 text-sm">${cat.descricao}</p></div>`;

            html += `<h3 class="text-lg font-semibold text-slate-800 mb-3 flex items-center gap-2"><i data-lucide="link" class="w-5 h-5 text-blue-600"></i> Sistemas e Links de Consulta</h3>`;
            html += `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-8">`;

            let linksFiltrados = cat.links.filter(l => 
                l.nome.toLowerCase().includes(filtroBusca.toLowerCase()) || 
                l.descricao.toLowerCase().includes(filtroBusca.toLowerCase())
            );

            if(linksFiltrados.length === 0) {
                html += `<p class="text-slate-500 italic col-span-full">Nenhum link encontrado.</p>`;
            } else {
                linksFiltrados.forEach(link => {
                    html += `
                        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-start gap-2">
                                    <h4 class="font-bold text-slate-900">${link.nome}</h4>
                                    <span class="text-xs px-2 py-0.5 rounded ${link.restrito ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'}">${link.restrito ? 'Restrito' : 'Público'}</span>
                                </div>
                                <p class="text-xs text-slate-600 mt-2">${link.descricao}</p>
                            </div>
                            <div class="mt-4 pt-3 border-t border-slate-100 flex justify-between items-center text-xs text-slate-500">
                                <span>Fonte: <strong>${link.orgao || 'Oficial'}</strong></span>
                                <a href="${link.url}" target="_blank" class="inline-flex items-center gap-1 text-blue-600 hover:text-blue-800 font-semibold">Acessar <i data-lucide="external-link" class="w-3.5 h-3.5"></i></a>
                            </div>
                        </div>
                    `;
                });
            }
            html += `</div>`;

            if (cat.indicadores && cat.indicadores.length > 0) {
                html += `<h3 class="text-lg font-semibold text-slate-800 mb-3 flex items-center gap-2"><i data-lucide="bar-chart-3" class="w-5 h-5 text-blue-600"></i> Indicadores do Município (Rondonópolis-MT)</h3>`;
                html += `<div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-x-auto"><table class="w-full text-left border-collapse text-sm">`;
                html += `<thead class="bg-slate-100 text-slate-700 text-xs uppercase"><tr><th class="p-3">Indicador</th><th class="p-3">Valor</th><th class="p-3">Período</th><th class="p-3">Fonte</th></tr></thead><tbody class="divide-y divide-slate-100">`;

                cat.indicadores.forEach(ind => {
                    html += `
                        <tr class="hover:bg-slate-50">
                            <td class="p-3 font-medium text-slate-900">${ind.nome}</td>
                            <td class="p-3 font-bold text-blue-600">${ind.valor}</td>
                            <td class="p-3 text-slate-600">${ind.periodo}</td>
                            <td class="p-3 text-slate-600">${ind.fonte}</td>
                        </tr>
                    `;
                });
                html += `</tbody></table></div>`;
            }

            painel.innerHTML = html;
            lucide.createIcons();
        }

        document.getElementById('busca-global').addEventListener('input', (e) => {
            renderizarConteudo(e.target.value);
        });

        carregarDados();
    </script>
</body>
</html>
